name: mobile-ui
on:
  pull_request:
    paths: ['site/**', 'tests/mobile_browser.py', 'tests/resident_services_browser.py', 'tests/city_select_browser.py', '.github/workflows/mobile-ui.yml']
  push:
    branches: [main]
    paths: ['site/**', 'tests/mobile_browser.py', 'tests/resident_services_browser.py', 'tests/city_select_browser.py', '.github/workflows/mobile-ui.yml']
  workflow_run:
    workflows: [pages]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  responsive-browser:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.57.0 -r requirements.txt
      - run: playwright install --with-deps chromium webkit
      - name: Mobile widths, touch targets, evidence, navigation and modal regression
        env:
          LIVE_CHECK: ${{ github.event_name == 'workflow_run' }}
        run: |
          if [ "$LIVE_CHECK" = "true" ]; then
            python3 tests/mobile_browser.py --base-url https://baichen99.github.io/rizi-city/
            python3 tests/city_select_browser.py --base-url https://baichen99.github.io/rizi-city/
            python3 tests/resident_services_browser.py --base-url https://baichen99.github.io/rizi-city/
          else
            python3 scripts/build.py
            python3 tests/mobile_browser.py
            python3 tests/city_select_browser.py
            python3 tests/resident_services_browser.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ui-screenshots
          path: artifacts/mobile/
          retention-days: 14
