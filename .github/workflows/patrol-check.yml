name: patrol-check

# PR uses a read-only token; no checkout or execution of PR application code/scripts.
# pull_request loads the merge-ref workflow: workflow edits still require human review.
# Issue automation remains on the default branch. No pull_request_target or workflow_run.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  issues:
    types: [opened, edited]

permissions: {}

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const item = context.payload.pull_request;
            const args = { owner: context.repo.owner, repo: context.repo.repo, pull_number: item.number };
            const current = (await github.rest.pulls.get(args)).data;
            if (current.head.sha !== item.head.sha) {
              core.setFailed('PR 已更新，本次检查已过期，请检查最新提交。'); return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, { ...args, per_page: 100 });
            const problems = [];
            if (!Number.isInteger(current.changed_files) || current.changed_files > 3000 || files.length !== current.changed_files) {
              core.setFailed('无法完整读取 PR 文件列表（分页缺失或超过 API 上限），需要人工复核。'); return;
            }
            const cities = files.filter(f => f.filename.startsWith('data/cities/') || (f.previous_filename || '').startsWith('data/cities/'));
            const patrol = (current.labels || []).some(l => l.name === 'agent-patrol') || /^patrol\//.test(current.head.ref) || /巡检/.test(current.title || '');
            if (!patrol && !cities.length) { core.info('不是巡检且未修改城市数据，跳过。'); return; }
            const body = current.body || '';
            const m1 = body.match(/###\s*agent 名称\s*\n+\s*([^\n]+)/i);
            const m2 = body.match(/^\s*[-*]?\s*agent\s*[:：]\s*([^\n]+)$/im);
            const m3 = body.match(/[（(]\s*agent\s*[:：]\s*([a-z0-9][a-z0-9 \-]*?)\s*[）)]/i);
            const agent = ((m1 && m1[1]) || (m2 && m2[1]) || (m3 && m3[1]) || '').trim();
            if (!agent) problems.push('请在 PR 正文补充 Agent: xxx（或 agent 名称小节，或「维护助手 xxx（agent:xxx）」署名）。');
            const allowed = h => /(^|\.)gov\.cn$/i.test(h) || /(^|\.)cih-index\.com$/i.test(h);
            let sourceCount = 0;
            for (const file of cities) {
              if (typeof file.patch !== 'string' || !file.patch.trim()) {
                problems.push('城市数据 diff 不可用，需要人工复核。'); continue;
              }
              // GitHub can omit or truncate patches. Verify every hunk's declared line counts.
              const lines = file.patch.split('\n');
              let oldLeft = 0, newLeft = 0, hunk = false;
              let validPatch = true;
              let added = 0, removed = 0;
              for (const line of lines) {
                const header = line.match(/^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@/);
                if (header) {
                  if (hunk && (oldLeft !== 0 || newLeft !== 0)) validPatch = false;
                  hunk = true; oldLeft = Number(header[2] ?? 1); newLeft = Number(header[4] ?? 1); continue;
                }
                if (line.startsWith('\\ No newline')) continue;
                if (!hunk) { validPatch = false; continue; }
                if (line.startsWith('+')) { newLeft--; added++; }
                else if (line.startsWith('-')) { oldLeft--; removed++; }
                else if (line.startsWith(' ')) { oldLeft--; newLeft--; }
                else if (line !== '') validPatch = false;
                if (oldLeft < 0 || newLeft < 0) validPatch = false;
                if (!line.startsWith('+')) continue;
                const source = line.slice(1).match(/^\s*(?:-\s*)?["']?(?:[a-z_]*source_url)["']?\s*:\s*(.*)$/i);
                if (!source) {
                  if (/source_url/i.test(line)) problems.push('来源字段格式不支持自动检查，需要人工复核。');
                  continue;
                }
                const urls = source[1].match(/https?:\/\/[^\s)'"<>\]},]+/g) || [];
                if (!urls.length) { problems.push('新增来源字段缺少可检查的 http(s) URL。'); continue; }
                for (const url of urls) {
                  sourceCount++;
                  try {
                    const parsed = new URL(url);
                    if (!allowed(parsed.hostname) || parsed.username || parsed.password) problems.push('新增来源不在官方域名白名单内或含 URL 凭据。');
                  } catch { problems.push('新增来源 URL 无效。'); }
                }
              }
              if (added !== file.additions || removed !== file.deletions) validPatch = false;
              if (!hunk || oldLeft !== 0 || newLeft !== 0 || !validPatch) problems.push('城市数据 diff 不完整或格式异常，需要人工复核。');
            }
            const latest = (await github.rest.pulls.get(args)).data;
            const labelSet = pr => JSON.stringify([...new Set((pr.labels || []).map(l => l.name))].sort());
            if (latest.head.sha !== current.head.sha || latest.base.sha !== current.base.sha ||
                latest.body !== current.body || latest.title !== current.title || labelSet(latest) !== labelSet(current)) {
              problems.push('检查期间 PR 已更新，请重新运行检查。');
            }
            const unique = [...new Set(problems)];
            await core.summary.addHeading('巡检来源检查').addRaw(
              unique.length ? unique.map(p => '- ' + p).join('\n') :
                sourceCount ? `已检查 Agent 信息和新增来源 URL 域名（${sourceCount} 个 URL）；不代表字段语法或来源真实性已验证。` :
                '未发现新增来源 URL，仍需人工核实本次变更。'
            ).addRaw('\n\n此检查不代表数据正确；官网核实、标签和评论由维护者（含授权助手）人工处理。').write();
            if (unique.length) core.setFailed(unique.join(' | '));
  issue-check:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const WHITELIST = [/\.gov\.cn$/i, /^gov\.cn$/i, /(^|\.)cih-index\.com$/i];
            const AGENTS = {
              'muse': 'agent:muse', 'dots': 'agent:dots', 'grok bot': 'agent:grok-bot',
              'claude code': 'agent:claude-code', 'codex': 'agent:codex', 'openclaw': 'agent:openclaw',
            };
            const isIssue = context.eventName === 'issues';
            const item = isIssue ? context.payload.issue : context.payload.pull_request;
            const body = item.body || '';
            const number = item.number;

            // 1) 识别是不是巡检
            const labels = (item.labels || []).map(l => l.name);
            let isPatrol = labels.includes('agent-patrol');
            if (!isPatrol && !isIssue) {
              isPatrol = /^patrol\//.test(item.head.ref) || /巡检/.test(item.title || '');
            }
            if (!isPatrol) { core.info('不是巡检，跳过'); return; }

            // 2) 识别 agent 名称（Issue Form 的 "### agent 名称" 小节、PR 正文里的 "Agent: xxx" / "agent：xxx"，或「维护助手 xxx（agent:xxx）」署名）
            let agent = null;
            const m1 = body.match(/###\s*agent 名称\s*\n+\s*([^\n]+)/i);
            const m2 = body.match(/^\s*[-*]?\s*agent\s*[:：]\s*([^\n]+)$/im);
            const m3 = body.match(/[（(]\s*agent\s*[:：]\s*([a-z0-9][a-z0-9 \-]*?)\s*[）)]/i);
            const raw = ((m1 && m1[1]) || (m2 && m2[1]) || (m3 && m3[1]) || '').trim().toLowerCase();
            agent = AGENTS[raw] || (raw ? 'agent:other' : null);

            // 3) 收集来源 URL
            let urls = [];
            const urlRe = /https?:\/\/[^\s)'"<>]+/g;
            if (isIssue) {
              for (const line of body.split('\n')) {
                if (/source_url\s*:/.test(line)) urls.push(...(line.match(urlRe) || []));
              }
            } else {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner, repo: context.repo.repo, pull_number: number,
              });
              for (const f of files) {
                if (!f.filename.startsWith('data/cities/')) continue;
                for (const line of (f.patch || '').split('\n')) {
                  if (line.startsWith('+') && /(source_url|medical_source_url|hukou_source_url|stats_source_url|rent_source_url)\s*:/.test(line)) {
                    urls.push(...(line.match(urlRe) || []));
                  }
                }
              }
            }
            const bad = urls.filter(u => {
              try { const h = new URL(u).hostname; return !WHITELIST.some(r => r.test(h)); }
              catch { return true; }
            });

            // 4) 格式检查
            const problems = [];
            if (!agent) problems.push('没有找到 agent 名称（Issue 表单的"agent 名称"，或 PR 正文里的 `Agent: xxx`，或「维护助手 xxx（agent:xxx）」署名）');
            if (isIssue) {
              if (!/```ya?ml[\s\S]*items\s*:/.test(body)) problems.push('报告里没有 patrol.md 第 5 节格式的 yaml 代码块（含 `items:`）');
              if (urls.length === 0) problems.push('报告里没有任何 `source_url`');
            }
            if (bad.length) problems.push('以下来源不在白名单内（落户和补贴只认 *.gov.cn，房租认 cih-index.com）：\n' + [...new Set(bad)].map(u => '  - ' + u).join('\n'));

            // 5) 打标签
            const add = ['agent-patrol'];
            if (agent) add.push(agent);
            if (problems.length) add.push('needs-source');
            await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: number, labels: add });

            // 6) 留言（只在有问题时，避免刷屏）
            if (problems.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: number,
                body: '自动检查发现以下问题，请修改后更新：\n\n' + problems.map(p => '- ' + p).join('\n') +
                      '\n\n—— 本回复由自动检查生成，只校验格式，不代表数据正确；所有合并由人工完成。',
              });
              core.warning(problems.join(' | '));
            } else {
              core.info(`通过：agent=${agent}，来源 ${urls.length} 条`);
            }
