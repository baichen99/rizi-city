# 国家层面的通用规则。城市 / 省份文件只写与这里的差异。
# 规则同 data/cities：只写原文口径，附官方来源和核验日期，不编。

civil_service:
  exam: 中央机关及其直属机构 2027 年度考试录用公务员（国考）
  fresh_grad:
    # 原文（报考指南第一章第 3 问）：
    #   国家统一招生的普通高校毕业生离校时和在择业期内（国家规定择业期为二年）未落实工作单位，
    #   其户口、档案、组织关系仍保留在原毕业学校，或者保留在各级毕业生就业主管部门（毕业生就业指导服务中心）、
    #   各级人才交流服务机构和各级公共就业服务机构的毕业生，可按应届高校毕业生对待。
    current_class: 2027          # 本次国考的应届届别（2027 届，学历学位取得时间一般截止到 2027 年 7 月）
    choose_job_years: [2025, 2026]   # 择业期内、可"按应届高校毕业生对待"的届别
    rule: 离校时和两年择业期内未落实工作单位，户口、档案、组织关系保留在原毕业学校或各级毕业生就业主管部门、人才交流服务机构、公共就业服务机构的，可按应届高校毕业生对待
    social_security_note: 原文没有提到社保。缴过职工社保是否会被认定为"已落实工作单位"，原文没写，以具体招考公告和招录机关资格审查为准。
    grassroots_project: 参加服务基层项目前无工作经历的人员，服务期满且考核合格后 2 年内，可以报考仅允许应届高校毕业生报考的职位
    returnee: 2025 年 1 月 1 日至面试前取得国（境）外学位并完成学历认证、未落实工作单位的留学回国人员，可以报考仅允许应届高校毕业生报考的职位
    qualification_deadline: 除 2027 届毕业生学历学位取得时间一般截止到 2027 年 7 月外，其他资格条件截止时间为 2026 年 10 月
  source_title: 中央机关及其直属机构 2027 年度考试录用公务员报考指南（国家税务总局上海市税务局转载）
  source_url: https://shanghai.chinatax.gov.cn/xxgk/rsxx/202610/t481764.html
  verified_at: 2026-11-09
  needs_human: false
