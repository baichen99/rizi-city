    type: rent
    amount: 博士每人每月 2000 元、硕士每人每月 800 元、学士（含高级工及以上）每人每月 600 元，补贴发放累计不超过 36 个月
    amount_by_degree: {associate: null, bachelor: 600, master: 800, phd: 2000}
    period: month
    periods_max: 36
    payout: 按月（每连续参保缴费 6 个月可申领一次）
