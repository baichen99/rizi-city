flexible_employment:
  pension_base_min: 5025
  pension_rate: 20
  pension_year: 2026
  medical_monthly_min: 412
  medical_note: 南京市口径（2026 年度）：灵活就业职工医保与养老同基数区间 5025–25127 元/月、自主选档，费率 8%（宁医发〔2023〕41号，2023-04-01 起执行，江苏省税务局 2025 年南京市征收标准表仍按 8% 列示）；另缴大病医疗救助费 10 元/月。按下限测算 5025×8%+10 = 412 元/月（官方未直接给 2026 年月额；测算方法与南京市医保局 2023 年发布会口径一致）
  monthly_total_min: 1417
  calc: 养老 5025 × 20% = 1005；医保 412（5025 × 8% + 大病医疗救助费 10 元）；合计 1417 元/月
  hukou_restriction: 养老保险已放开户籍限制，可在就业登记地参保；职工医保外地户籍须持南京市居住证（含港澳台居民居住证）
  nonlocal_allowed: true
  apply_channel: 先办就业登记、再办社保登记（江苏人社网上办事服务大厅、「江苏智慧人社」APP、「我的南京」APP 或各区经办机构）；医保登记经「南京医保」公众号、「我的南京」App
  source_url: https://jshrss.jiangsu.gov.cn/art/2026/10/8/art_77277_11838872.html
