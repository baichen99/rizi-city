  - name: 高校毕业生住房租赁补贴
    type: rent
    amount: 博士每人每月 2000 元、硕士每人每月 800 元、学士（含高级工及以上）每人每月 600 元，补贴发放累计不超过 36 个月
    amount_by_degree: {associate: null, bachelor: 600, master: 800, phd: 2000}
    period: month
    periods_max: 36
    payout: 按月（每连续参保缴费 6 个月可申领一次）
    target: 与南京市用人单位签订劳动合同的高校毕业生（无房为必要条件）
    conditions:
      - 首次申请应在毕业之日起 2 年半内提交，末次申请应在享受补贴的首月起 5 年内提交
      - 审核采用「3+1」要素：无房、学历、社保 + 租住状态承诺
      - 2026 年起另有提标：大专（高级工以上）500 元/月、重点领域规上企业新引进毕业生博士 2400 元/月、硕士 960 元/月等（宁人社规〔2026〕6号），详见原文；本条记全市统一基础标准
    deadline_rule: 首次申请须在毕业之日起 2 年半内
    policy_name: 《南京市人力资源和社会保障局等七部门关于优化调整高校毕业生住房租赁补贴政策的通知》（宁人社规〔2025〕2号，2025-10-01 起施行，有效期 5 年）；2026 年调整为宁人社规〔2026〕6号
