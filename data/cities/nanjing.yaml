  - name: 高校毕业生一次性生活补贴
    type: living
    amount: 学士 1 万元、硕士 3 万元、博士 10 万元，同一人只能享受一次（分两笔各发 50%：连续参保满 6 个月后申领第一笔、满 12 个月后申领第二笔）
    amount_by_degree: {associate: null, bachelor: 10000, master: 30000, phd: 100000}
    period: once
    periods_max: 1
    payout: 分两笔各 50%
    target: 在南京市各类用人单位就业创业、取得学士及以上学位的全日制普通高校毕业生（含国（境）外），或首次就业创业的非全日制研究生；在宁缴纳企业职工基本养老保险等（条件满足其一，见原文）
    conditions:
      - 参保首月须在毕业后 1 年内，第一笔申领须在毕业后一年半内，第二笔申领须在毕业后两年内，逾期不补发
    deadline_rule: 第二笔申领须在毕业后 2 年内
