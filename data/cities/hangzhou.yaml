hukou:
  summary: 全日制大专及以上在杭落实就业即可落户市区；本科毕业两年内、45 周岁以下硕士、55 周岁以下博士可"先落户后就业"
  education_min: 全日制普通高校大专
  age_limit: 大专 35 周岁以下、本科 45 周岁以下、硕士 50 周岁以下、博士 55 周岁以下（不含本数）
  requires_job_or_social_security: null   # 分学历不同，见 tier_by_degree
  eligible_by_degree: {associate: true, bachelor: true, master: true, phd: true}
  tier_by_degree: {associate: job, bachelor: direct, master: direct, phd: direct}
  age_max_by_degree: {associate: 35, bachelor: 45, master: 50, phd: 55}
  conditions:
    - 本科"先落户后就业"仅限毕业两年内；毕业两年以上的本科需在杭落实就业
    - 硕士 45—50 周岁需在杭落实就业；45 周岁以下可先落户后就业
    - 2017 年以后录取的符合条件的非全日制研究生参照全日制政策
  apply_window: 常态办理
  policy_name: 杭州市公安局关于市政协十二届四次会议第255号提案的答复（2025-09-05）；依据《关于进一步深化户籍制度改革的实施意见》杭政办函〔2023〕33号
  source_url: https://police.hangzhou.gov.cn/art/2025/9/5/art_1229456313_4401129.html
  source_date: 2025-09-05
  valid_until: null
  verified_at: 2026-11-09
