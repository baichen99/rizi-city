subsidies:
  - name: 应届大学生生活补贴
    type: living
    amount: 本科 1 万元、硕士 3 万元、博士 10 万元；分两笔各 50%，连续参保满 6 个月发第一笔、满 12 个月发第二笔
    amount_by_degree: {associate: null, bachelor: 10000, master: 30000, phd: 100000}
    period: once
    periods_max: 1
    payout: 一次性额度，分两笔发放
    target: 来杭工作的全球本科及以上学历应届毕业生（含毕业 5 年内回国留学人员、外国人才）
    conditions:
      - 在杭连续参保（不含补缴）满 6 个月、12 个月分别申领
      - 在富阳、临安、桐庐、淳安、建德工作满 3 年后可再领一次相同额度
    deadline_rule: null
    policy_name: 杭向未来·大学生创新创业三年行动计划（2023—2025年），杭政办函〔2023〕45号
    source_url: https://zfgb.hangzhou.gov.cn/upload/default/bigfile/2025/06/03/20250603_562deab400886218555373e97529e338.pdf
    source_date: 2023-06
    valid_until: 2025-12-31
    verified_at: 2026-11-09
    needs_human: true
    needs_human_reason: 该行动计划有效期至 2025-12-31，已到期。截至 2026-11-09 在杭州市政府、人社局、政府公报网站未检索到 2026 年接替文件；需人工确认 2026 年是否仍在发放、口径是否变化（可致电 12345 或查"杭州人才码"申报页）。
    access_blocked: false
    lead: 媒体（杭州本地宝等）2026 年页面仍按本科 1 万、硕士 3 万、博士 10 万描述，但未注明 2026 年依据文件
    lead_url: https://hz.bendibao.com/live/2026319/169317.shtm

  - name: 新引进应届大学生租房补贴
    type: rent
    amount: 每户每年 1 万元，发放 3 年；期满后收入低于城镇居民人均可支配收入的可继续享受，累计最长不超过 6 年；每年分两笔各 50%
    amount_by_degree: {associate: null, bachelor: 10000, master: 10000, phd: 10000}
    period: year
    periods_max: 3
    payout: 按年发放，每年两笔
    target: 在杭无房且未享受公租房、人才租赁房等住房优惠的新引进应届全日制本科及以上毕业生
    conditions:
      - 在杭用人单位就业或自主创业，在杭连续缴纳社保（不含补缴）6 个月
      - 与公租房货币补贴只能二选一
    deadline_rule: 首次申请须在毕业后 2 年内；毕业后 1 年半内需有符合连续参保时长的记录，且连续参保首月在毕业后 1 年内
    policy_name: 杭政办函〔2023〕45号；市住保房管局《留杭工作应届大学生，这笔补贴别忘了申请》（2025-03-10）
    source_url: https://fgj.hangzhou.gov.cn/art/2025/3/10/art_1229265015_58878510.html
    source_date: 2025-03-10
    valid_until: 2025-12-31
    verified_at: 2026-11-09
    needs_human: true
    needs_human_reason: 上位文件杭政办函〔2023〕45号已于 2025-12-31 到期，未检索到 2026 年接替文件。市住保房管局 2025-12-11 仍在宣传申领（经杭州发布转载），但无法确认 2026 年新毕业生是否适用。
    access_blocked: false
    lead: 杭州发布 2025-12-11 转载市住保房管局申领指南，口径与 2025 年一致
    lead_url: https://hwyst.hangzhou.com.cn/mtld/content/2025-12/11/content_9141763.htm

