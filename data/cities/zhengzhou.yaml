flexible_employment:
  pension_base_min: 3912
  pension_rate: 20
  pension_year: 2026 年度（2026-07-01 起）
  medical_monthly_min: null
  medical_note: 《郑州市职工基本医疗保险办法》第九条：灵活就业人员以本市上年度在岗职工月平均工资的 80% 为基数、费率 10% 定额缴费；自 2024-01-01 起应同时参加生育保险（费率 1%，基数与职工医保一致）。官方页面未给出当前年度社平工资数额与月缴额原文（市政府问答页仅有未标注年度的示例数字），且市医保局 2026 年工作要点称继续实施阶段性降低职工医保费率，实际执行费率可能低于 10%——故月缴额不推算、不填报，待官方公布现行年度数字后再补
  monthly_total_min: null
  calc: null
  hukou_restriction: null
  nonlocal_allowed: null
  apply_channel: 自 2024-04-01 起向税务部门申报缴费基数和缴费
  source_url: https://shbx.hrss.henan.gov.cn/hnsi/zhengce/fagui/webinfo/1794202557855397.htm
  medical_source_url: https://public.zhengzhou.gov.cn/D0107Y/248209.jhtml
  hukou_source_url: null
  verified_at: 2026-11-09
