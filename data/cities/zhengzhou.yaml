  needs_human_reason: 缴费比例 20% 取自中国政府网全国通行说明（https://www.gov.cn/yaowen/liebiao/202305/content_6855917.htm）；郑州灵活就业医保的计费规则已核实（办法第九条），但现行年度月缴额缺官方数字且有阶段性降费因素，暂不填报；外地户籍参保条件缺官方原文。
  access_blocked: false

civil_service:
  fresh_grad_rule: 河南2026事业单位联考（仅该批次）将“择业期内高校毕业生”定义为2024、2025、2026年毕业生，条件说明本条未加未就业要求，仍须符合具体岗位条件。省考应届身份的择业期、就业等认定未核实，不据此套用省考；2026省考普通高校当年应届生须2026-07-31前取得毕业证/学位证并以即将获得的最高学历报考。 事业单位来源：https://rbj.jiyuan.gov.cn/rbj_xwzx/rbj_tzgg/t1000920.html
  exam_schedule: 河南2026省考（历史批次已结束）：报名2026-01-06 09:00至01-12 17:00；行测2026-03-14 09:00—11:00，申论14:00—16:30，公安专业科目2026-03-15 09:00—11:00。未核实到2027正式省考公告。 事业单位：报名2026-04-24 09:00至04-30 17:00；笔试2026-05-30 09:00—10:30职业能力测验，14:00—15:30公共基础知识/教育类专业知识/卫生类专业知识。均已结束。 来源：https://rbj.jiyuan.gov.cn/rbj_xwzx/rbj_tzgg/t1000920.html
  announcement_url: https://www.jiyuan.gov.cn/zwgk/jczwgk/rsxx/gwyzk/t994646.html
  source_url: https://www.jiyuan.gov.cn/zwgk/jczwgk/rsxx/gwyzk/t994646.html
