flexible_employment:
  pension_base_min: 4553
  pension_rate: 20
  pension_year: 2026 年度
  medical_monthly_min: 258.75
  medical_note: 重庆 2026 年度灵活就业职工医保按年缴费，一档 3105 元/年（基本医疗 2484 + 大额医疗 621），折合每月 258.75 元；正常参保须在 2026-03-31 前按年一次性缴清
  monthly_total_min: 1169.35
  calc: 养老 4553 × 20% = 910.60；医保一档 3105 ÷ 12 = 258.75；合计 1169.35 元/月
  hukou_restriction: 养老不受户籍限制（外省户口凭身份证+居住证办理）；医保市外户籍可参加，首次参保或断缴超 3 个月再参保时男未满 63 周岁、女未满 58 周岁，且未在市外办理养老退休
  nonlocal_allowed: true
  apply_channel: 养老：线上「重庆人社」App，线下社保办事大厅或社银合作网点（本市户口凭身份证，外省户口凭身份证+居住证）；医保按年一次性缴纳，税务部门渠道缴费
  source_url: https://rlsbj.cq.gov.cn/zwgk_182/zcjd/shbz/202610/t20261028_16310707.html
  medical_source_url: https://www.cq.gov.cn/zwgk/zfxxgkzl/fdzdgknr/zdmsxx/yl/yl_ssqk/202601/t20260105_15289547.html
  hukou_source_url: https://ylbzj.cq.gov.cn/zwgk_535/zcjd/wzjd/202506/t20250611_14704442.html
  verified_at: 2026-11-11
  needs_human: false
  needs_human_reason: 养老缴费比例 20% 取自中国政府网全国通行说明（https://www.gov.cn/yaowen/liebiao/202305/content_6855917.htm）
  access_blocked: false

