hukou:
  summary: 应届生进沪就业落户实行评分制，2026 年标准分 72 分；博士符合基本条件即可落户，在沪高校和"世界一流"建设高校（学科）应届硕士符合基本条件即可落户；需有在沪用人单位
  education_min: 普通高校本科（应届）
  age_limit: 原文未单列年龄上限
  requires_job_or_social_security: true
  eligible_by_degree: {associate: null, bachelor: true, master: true, phd: true}
  tier_by_degree: {associate: null, bachelor: quota, master: quota, phd: job}
  age_max_by_degree: {associate: null, bachelor: null, master: null, phd: null}
  conditions:
    - 须与在沪用人单位签订一年及以上就业协议；中介机构派遣人员不予受理
    - 在校期间未与任何用人单位存在劳动或聘用关系、未缴纳社会保险（自主创业等例外）
    - 硕士：在沪高校、在沪研究所及"世界一流大学建设高校"、"世界一流学科建设高校"建设学科应届硕士符合基本条件即可落户；其他硕士和本科按评分
  apply_window: 2026 年 5 月 11 日至 7 月 3 日（工作日）；部分情形可延长至 12 月 31 日。2027 届文件预计 2027 年春发布
  policy_name: 2026 年非上海生源应届普通高校毕业生进沪就业申请本市户籍办法，沪教委学〔2026〕13号
  source_url: https://www.shanghai.gov.cn/cmsres/c0/c0be2153e4e04371a7bd856e099f83fc/03cad02918ba513e483ac2037250f613.pdf
  source_date: 2026-04-22
  valid_until: null
  verified_at: 2026-11-09
  needs_human: false
  needs_human_reason: null
  access_blocked: false
  lead: null
  lead_url: null

subsidies:
  - name: 新就业青年安居服务（保租房租金补贴）
    type: other
    amount: 租住保租房按环线分档补贴：外环内不超过备案价 40%、每套每月最高 2500 元；外郊环间不超过 50%、最高 2000 元；郊环外不超过 60%、最高 1500 元；第二年退坡 50%，最长 2 年（各区执行，徐汇区口径）
    amount_by_degree: {associate: null, bachelor: null, master: null, phd: null}
    period: month
    periods_max: 24
    payout: 以优惠价形式抵扣保租房租金，不发现金
    target: 35 周岁以下、2026-01-01 以后在沪新就业缴社保、"高水平大学"本科及以上且毕业不满 3 年的青年（徐汇区口径）
    conditions:
      - 只适用于保租房房源，须通过随申办"我要租房—新就业青年安居服务"申请
      - 本人及配偶、未成年子女在沪无自有住房；社保基数不超过上年度平均工资 2 倍
      - 各区对学校层次要求不同（如普陀要求"双一流"或世界排名前 500）
    deadline_rule: 毕业不满 3 年
    policy_name: 徐汇区上线新就业青年住房优惠（上海市政府网 2026-08-07 转载）
    source_url: https://www.shanghai.gov.cn/nw17239/20260807/298edd6be1494e7d91cb27a7490dc44d.html
    source_date: 2026-08-07
    valid_until: null
    verified_at: 2026-11-09
