pitfalls:
  - text: 想走上海应届生落户，在校期间千万别跟单位建立劳动关系或缴社保（实习也要注意），也别通过中介派遣入职，否则直接不受理。
    source_url: https://www.shanghai.gov.cn/cmsres/c0/c0be2153e4e04371a7bd856e099f83fc/03cad02918ba513e483ac2037250f613.pdf
  - text: 上海灵活就业社保比例是养老 24%、医保 11%，比多数城市（养老 20%）高；而且只能按月缴，不能事后补缴。
    source_url: https://www.shanghai.gov.cn/gwk/search/content/t0035_1415199

