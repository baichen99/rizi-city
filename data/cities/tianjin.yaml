civil_service:
  fresh_grad_rule: 2027天津省考：应届高校毕业生含2027年统招毕业生、2025/2026年统招毕业且未落实工作者；2025—2027年服务基层项目期满考核合格者；2025年1月至报名前退役的大学生军士或义务兵及在校入伍复学后2025—2027年毕业者；2025/2026年取得境外学位未落实工作者及2027年取得境外学位者。“2027届高校毕业生”职位另限指南第5问四类，不可直接等同上述应届范围。报名时符合认定、之后签合同缴社保，仍按相应应届身份认定。
  exam_schedule: 2027年度天津省考：报名2026-11-03 08:30至2026-11-09 18:00（截至巡查已截止）；专业科目2026-12-05 14:30—16:30；行测2026-12-06 09:00—11:00，申论14:00—16:30。缴费至2026-11-11 16:00。
