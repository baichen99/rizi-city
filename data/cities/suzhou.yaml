  fresh_grad_rule: 2027苏州公务员：2027应届本科生以本科学历、应届研究生以研究生学历报一般岗位不限生源；应届研究生用本科学历限苏州生源或户籍，社会人员用本科学历限苏州户籍。应届专岗60—69为2027普通高校应届及简章第2—4项特定群体；研究生学历及相应学位不限生源，本科限江苏生源，不能用以前学历或非普通高校学历报该专岗。 另：2026省属事业统招允许2024、2025普通高校毕业生报名时无工作单位者报2026毕业生岗（历史批次）。来源：https://jiangsu.chinatax.gov.cn/art/2026/3/18/art_8274_1719146.html
