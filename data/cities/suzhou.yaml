flexible_employment:
  pension_base_min: 5025
  pension_rate: 20
  pension_year: 2026
  pension_note: 2026-01-01 至 2026-12-31 养老基数为 5025—25127 元/月，可自选档次；本地人社口径费率为 20%，其中 8% 计入个人账户。已核对官方缴费表，最低档月缴 1005 元；2026 年 9 月 30 日前已缴养老、医保费原则上不补差，未缴的按新基数执行。
  pension_base_source_url: https://www.suzhou.gov.cn/szsrmzf/mszx/202610/3e20e821e48946c0bb2065cfb7c36429.shtml
  medical_monthly_min: 407
  medical_note: 2026 年调整后灵活就业职工医保缴费基数为 5025 元，费率 8%，月缴 407 元（含 5 元大额医疗费用社会共济基金）；全市灵活就业费率自 2024-01 起按 8% 执行，不套用单位职工的单位费率。
  monthly_total_min: 1412
  calc: 按 2026 年调整后最低档同时参加职工养老和职工医保：养老 5025 × 20% = 1005；医保 407（含大额共济 5 元）；合计 1412 元/月，不是单位职工个人代扣额，也不是所有居民必缴金额。
  hukou_restriction: 符合条件的外地户籍灵活就业人员可参保，不是无条件参保。养老自 2021 年 9 月起取消外省户籍限制，须先在苏州办理灵活就业登记；医保适用于本市行政区域内无雇工个体户、未在单位参保的非全日制或新业态从业人员、自由职业者及其他灵活就业人员。非本市户籍常住人员线下办理需身份证、居住证，在居住地社区申报。
  nonlocal_allowed: true
  apply_channel: 先登记参保，再缴费。养老可通过「江苏智慧人社」APP、小程序或江苏人社网上大厅办理；医保可通过「江苏医保云」APP、江苏医保公共服务平台个人网厅办理，也可到户籍或居住地社区登记。缴费使用「江苏税务社保缴纳」小程序、「苏周到」APP、电子税务局 APP 或税银经办银行网点。
  source_url: https://www.suzhou.gov.cn/szsrmzf/lhjycjwt/202505/9e5f041a073a440a96a3cf25f7176f5f.shtml
  medical_source_url: https://www.suzhou.gov.cn/szsrmzf/mszx/202610/3e20e821e48946c0bb2065cfb7c36429.shtml
  hukou_source_url: https://www.suzhou.gov.cn/szsrmzf/lhjydj/lhjydj.shtml
  verified_at: 2026-11-10
