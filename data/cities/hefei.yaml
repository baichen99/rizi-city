  medical_source_url: https://www.moj.gov.cn/pub/sfbgw/flfggz/flfggzdfzwgz/202304/t20230426_477778.html
  hukou_source_url: https://rsj.huaibei.gov.cn/gzdt/gfxwj/56894861.html
