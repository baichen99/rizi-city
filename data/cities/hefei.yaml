  medical_monthly_min: 261.24
  medical_note: 合肥市医保口径：灵活就业职工医保按省平均工资 60% 为基数、费率 6%，不建个人账户；按下限 4354 元测算 261.24 元/月。费率据《合肥市基本医疗保险办法》（市政府令第 213 号）第九条第（二）项原文，司法部官网全文页逐字核读（2026-11-11）；2024 年令第 223 号修订未改第九条费率。大病保险为同步待遇、无另行收费；职工医疗救助保险费自 2022 年起停止征收；无大额医疗单独收费
  monthly_total_min: 1132.04
  calc: 养老 4354 × 20% = 870.80；医保 4354 × 6% = 261.24（基数×费率测算，基数下限据安徽省五部门 2026 年通知）；合计 1132.04 元/月
  hukou_restriction: 养老：按安徽省规定，符合条件的省内户籍灵活就业人员凭有效身份证件，可选户籍地、就业地或居住地；省外户籍凭有效身份证件可选就业地或居住地；港澳台籍凭港澳台居民居住证在就业地或居住地参保。经办不得以户籍性质、地域范围、居住证明或灵活就业证明等限制养老参保。以上不等于无年龄或账户条件，也不代表医保办理条件已全部核实。
