subsidies:
  - name: 重点单位高校毕业生租房保障（住房租赁补贴）
    type: rent
    amount: 博士每年 3.6 万元、硕士每年 2 万元、本科每年 1.5 万元，3 年内分期发放；也可选择免费租住国有租赁公司房源 3 年（二选一）
    amount_by_degree: {associate: null, bachelor: 15000, master: 20000, phd: 36000}
    period: year
    periods_max: 3
    payout: 分期发放（3 年内）
    target: 仅限产业及相关领域重点单位的新来肥就业人才：35周岁以下的博士研究生、硕士研究生、普通高校本科毕业生，通过工作单位在肥缴纳社会保险且在肥无自有住房；现金租赁补贴需在肥自行租住。不是所有同学历毕业生均可领取。
    conditions:
      - 适用单位仅包括重点产业链入库企业、国家专精特新“小巨人”企业、安徽省专精特新冠军企业、总部经济企业、新型研发机构、科技成果转化企业、科技招商企业、高端生产性服务机构；须属于政策规定的重点单位范围
      - 金额为符合单位、学历、年龄、就业、参保和住房条件后的政策上限；申请批次、首次来肥认定、连续参保要求和兑现规则尚未核到完整申报指南，以主管部门现行申报指南为准
      - 本条已核政策要点未列大专现金租赁补贴档，不据此推断其他人才或住房政策不存在
    deadline_rule: null
    policy_name: 《合肥市服务人才发展若干政策（修订版）》政策要点，产业及相关领域重点单位人才服务保障部分
    source_url: https://www.hfxf.gov.cn/rsks/ysfwsc/18854737.html
    source_date: 2025-06-18
    valid_until: 2026-12-31
    verified_at: 2026-11-10
    needs_human: true
    needs_human_reason: 已核官方政策要点的金额、重点单位范围、基本对象和有效期；完整申报指南、首次来肥认定、连续参保及申请批次未核，不计入可领总额或排行，不能据此判断个人符合条件。
    access_blocked: false
    lead: null
    lead_url: null

