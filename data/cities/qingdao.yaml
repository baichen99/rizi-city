  medical_note: 自2026年1月起，职工医保省级统筹统一筹资标准：灵活就业人员以不低于全省上年度全口径城镇单位就业人员月平均工资60%为缴费基数，可按7%或9%缴纳（泰安市医保局2026-11-18问答，gov.cn，省级统筹统一标准）；2026年缴费基数下限4573元（鲁人社字〔2026〕75号，青岛税务官网2026-08-25发布），4573×9%=411.57元/月；青岛普通灵活就业人员医保费率9%见青岛政务网2026-06-08问答，市医保局明白纸（2026-02-04）同口径9%单档自2026-01-01起。参保办理条件已核实（2026-11-19）：医保局《医疗保障经办服务办事指南（2026版 11月修订）》1.2节，灵活就业人员只需有效身份证件、《职工基本医疗保险参保登记表》，无户籍或居住证要求。起算月份与基数规则依据为省级统筹统一标准，青岛市级页面未单列该条。
  monthly_total_min: 1326.17
