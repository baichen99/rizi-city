    basis: 青岛政务网2026-06-08问答 https://www.qingdao.gov.cn/ywdt/zwzl/zxwdpt_00/zxwdpt_31/202606/t20260608_10629499.shtml 官方搜索正文列9%，直接请求重定向循环；青岛税务官网2026-08-25发布省四部门通知 https://qingdao.chinatax.gov.cn/xxgk2019/tztg/202608/t20260825_107402.html 直接核到2026年4573–22863，落款2026-08-14；医保不受户籍地限制见2026-11-03官方索引 https://www.qingdao.gov.cn/zwgk/xxgk/rlshbz/gkml/gwfg/202611/t20261103_10767701.shtml 。不以媒体转载替代医保局明白纸直读，不绕过证书警告，不在未核起算月份时发布全年月缴或最低合计。
  - date: '2026-11-19'
