  - name: 博士安家费与区级生活补贴
    type: living
    amount: 博士毕业生在广州就业并落户，可享市 10 万—20 万元安家费和区最高 12 万元生活补贴；硕士、本科在广州就业并落户，工作所在区最高给予 6 万元、3 万元生活补贴
    amount_by_degree: {associate: null, bachelor: null, master: null, phd: null}
    period: once
    periods_max: 1
    payout: 一次性（按市、区分别发放）
    target: 在广州就业并落户的博士、硕士、本科毕业生
    conditions:
      - 金额为区间或"最高"，具体由市、区政策确定
    deadline_rule: null
    policy_name: 广州市人社局《来穗就业创业有什么福利？广州青年人才"五来"礼遇来了》（2026-03-20）
    source_url: https://rsj.gz.gov.cn/ywzt/jycy/gzdt/content/post_10734650.html
    source_date: 2026-03-20
    valid_until: null
    verified_at: 2026-11-09
    needs_human: true
    needs_human_reason: 原文只给出区间（博士市级 10—20 万）和区级"最高"金额，没有确定值；是否按下限计入合计待你决定，暂不计入。
    access_blocked: false
    lead: 南沙区：新落户就业的本科、硕士、博士可连续 30 个月领每月 1000、2000、4000 元生活补贴（区级）
