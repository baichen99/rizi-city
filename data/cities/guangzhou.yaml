hukou:
  summary: 在广州就业或创业的人才可申请入户：博士 50 周岁以下、硕士 45 周岁以下、全日制本科并有学士学位 40 周岁以下；本科以上无名额限制、网办"秒批"
  education_min: 国内普通高校全日制本科并有学士学位
  age_limit: 博士 50、硕士 45、本科（有学士学位）40 周岁以下
  requires_job_or_social_security: true
  eligible_by_degree: {associate: false, bachelor: true, master: true, phd: true}
  tier_by_degree: {associate: null, bachelor: job, master: job, phd: job}
  age_max_by_degree: {associate: null, bachelor: 40, master: 45, phd: 50}
  conditions:
    - 须在广州就业（与用人单位签劳动合同）或创业，并有社保缴费记录；工作单位须与参保单位一致
    - 本科须同时有学士学位
  apply_window: 常态办理（"广州人社"公众号、"穗好办"APP、广东政务服务网）
  policy_name: 广州市引进人才入户管理办法，穗府办规〔2025〕9号重新发布（有效期延长至 2026-12-31）
  source_url: https://www.gz.gov.cn/zwgk/fggw/sfbgtwj/content/post_10343147.html
  source_date: 2025-07-04
  valid_until: 2026-12-31
