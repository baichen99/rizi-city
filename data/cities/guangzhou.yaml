civil_service:
  fresh_grad_rule: 2027省考区分“限2027届”与“限应届”：前者面向统招2027届非在职毕业生；后者还包括2025、2026届未落实工作单位者、2025-01-09至报名首日取得境外学历学位且未就业并按时认证者、正在服务基层项目或期满考核合格2年内者；应届岗须以最高学历专业报考。2026事业单位集中招聘应届岗还覆盖当届职业学校、技工院校毕业生等，须按该批次指南单独认定，不可套用2027省考年份。 事业单位依据：https://hrss.gd.gov.cn/attachment/0/605/605124/4848983.docx
  exam_schedule: 2027省考：报名2026-11-02 09:00至11-06 16:00，已结束；缴费确认2026-11-14 09:00至11-16 16:00；笔试2026-12-06，行测14:00—15:30、申论16:15—18:45。2026事业单位集中招聘（历史批次）：报名2026-02-02 09:00至02-06 16:00，已结束；原公告只载笔试2026年3月，具体日期待补核。 事业单位依据：https://hrss.gd.gov.cn/zwgk/sydwzp/zpgg/content/post_4848983.html
  announcement_url: https://hrss.zs.gov.cn/tzgg/gggs/content/post_2660909.html
  source_url: https://hrss.zs.gov.cn/attachment/0/581/581485/2660909.doc
  verified_at: '2026-11-09'
  needs_human: true
  needs_human_reason: 仅完成省级口径核实；2026事业单位集中招聘公告仅载3月笔试，后续具体日期尚未读到。广州、深圳各自独立事业单位批次不由省级内容替代。
  access_blocked: false

