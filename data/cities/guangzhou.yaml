flexible_employment:
  pension_base_min: 5521
  pension_rate: 20
  pension_year: 2026 社保年度（2026-07-01 至 2027-06-30）
  pension_note: 5521元下限自2026-07-01起执行，上限27603元；2026年1—6月下限5510元。20%为符合条件灵活就业人员的养老费率。
  pension_base_source_url: https://zhsi.zhuhai.gov.cn/zcfg/content/post_3949111.html
  medical_monthly_min: 498.72
  medical_note: 2026-01-01 至 2026-12-31，广州12345官方公开答复直接列明职工医保基数 6234–31170 元/月，2024年全口径月均工资10390元；该答复未标发布日期，核验于2026-11-10，并非税务年度公告。灵活就业费率8%、大额医疗补助不另缴依据穗医保规字〔2022〕1号（有效至2026-12-31，https://www.gz.gov.cn/gfxwj/sbmgfxwj/gzsylbzj/content/post_8689834.html）；2024-03至2025-12的6.5%阶段性降费已到期。按下限计算6234×8%=498.72元/月，仅为缴费参考，不含个人具体补缴。
  monthly_total_min: 1602.92
  calc: 仅适用2026-07-01至2026-12-31的共同有效期间：养老5521×20%=1104.20；医保6234×8%=498.72；合计1602.92元/月。2026年上半年养老下限不同，2027医保标准须另核，不跨期沿用本合计。
  hukou_restriction: 法定劳动年龄内符合条件的非本地户籍灵活就业人员，可凭有效身份证件和广东就业登记证明在就业地参保；港澳台居民、无雇工个体工商户等按相应证件路径办理。养老首次跨省参保等另有账户规定，不等同于退休待遇领取资格。
  nonlocal_allowed: true
  apply_channel: 「粤税通」「粤省事」小程序线上办理缴费登记，或办税服务厅同城通办
  source_url: https://guangdong.chinatax.gov.cn/gdsw/ssfggds/2026-05/06/content_45505ebfc8f54089ae9bd6300fd49138.shtml
  medical_source_url: https://wx12345.gzonline.gov.cn/km/showMsg?id=BEAFDBCFD
  hukou_source_url: https://guangdong.chinatax.gov.cn/gdsw/ssfggds/2022-01/29/content_651e1cba3b6c4b4a8f27b463b184e599.shtml
  verified_at: 2026-11-10
