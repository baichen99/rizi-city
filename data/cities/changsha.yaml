hukou:
  summary: 45 周岁（含）以下专科及以上学历（研究生不限年龄）经认定可凭毕业证直接落户；户口在学校集体户、有在长就业意向的长沙高校毕业生可认定为青年储备人才落户
  education_min: 专科
  age_limit: 45 周岁（含）以下；博士、硕士研究生不受年龄限制
  requires_job_or_social_security: false
  eligible_by_degree: {associate: true, bachelor: true, master: true, phd: true}
  tier_by_degree: {associate: direct, bachelor: direct, master: direct, phd: direct}
  age_max_by_degree: {associate: 45, bachelor: 45, master: 0, phd: 0}
  conditions:
    - 需经人才认定（自贸区人才引进），通过"我的长沙"APP 选择"自贸区人才引进"申请
    - 年龄上限 45 周岁为"含"本数
  apply_window: 常态办理
  policy_name: 中国（湖南）自由贸易试验区长沙片区人才集聚发展若干措施（试行），长办发〔2021〕7号 第 6 条；长沙市公安局 2023-11 户口迁移政策优化通知
  source_url: http://ftz.hunan.gov.cn/hnzm/sjzc/202104/t20210420_33635926.html
  source_date: 2021-04
  valid_until: null
  verified_at: 2026-11-09
  needs_human: false
  needs_human_reason: null
  access_blocked: false
  lead: null
  lead_url: null

subsidies:
  - name: 青年人才租房和生活补贴
    type: living
    amount: 博士 3 万元、硕士 2 万元、全日制本科 1.2 万元（境外高校博士 10 万元）
    amount_by_degree: {associate: null, bachelor: 12000, master: 20000, phd: 30000}
    period: once
    periods_max: 1
    payout: 原文给出的是每人总额；据办法原文按实际缴纳社保情况按月发放、最长两年（办法全文页面目前 404，未能重新打开核实发放节奏）
    target: 35 周岁（含）以下、毕业两年内、落户并在长沙工作的博士、硕士、全日制本科毕业生
    conditions:
      - 落户长沙并在长沙工作
      - 通过"长沙人才"App 申请
    deadline_rule: 毕业两年内
