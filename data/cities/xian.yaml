pitfalls:
  - text: 西安"择业期落户"只认毕业 2 年内；超过 2 年就要走人才评价或居住证 + 社保满 3 年等其他通道。
    source_url: http://police.xa.gov.cn/zwgk/zfwj/bmwj/1712411225725870081.html
  - text: 西安灵活就业医保是"集中缴费期"一次性缴全年，2026 年度窗口在 2025-11 至 2026-01-09，错过要看经办机构安排。
    source_url: https://xdz.xa.gov.cn/zwgk/jbmsbz/shbz/1990608250116059137.html

