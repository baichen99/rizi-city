hukou:
  summary: 毕业 2 年择业期内的全日制普通高校大专及以上毕业生，有意愿在西安就业并有合法稳定住所（租房、租期不限）即可落户，不要求先就业
  education_min: 全日制普通高等学校大专
  age_limit: 原文未设年龄限制；限毕业 2 年择业期内
  requires_job_or_social_security: false
  eligible_by_degree: {associate: true, bachelor: true, master: true, phd: true}
  tier_by_degree: {associate: direct, bachelor: direct, master: direct, phd: direct}
  age_max_by_degree: {associate: 0, bachelor: 0, master: 0, phd: 0}
  conditions:
    - 限毕业 2 年择业期内
    - 需有合法稳定住所，租房即可且租期无限制；可落本人住所、单位集体户或社区集体户
    - 西安生源全日制大中专应届毕业生可回西安落户
  apply_window: 常态办理
  policy_name: 西安市公安局关于进一步优化户籍管理工作的通知（2023-10-13）
  source_url: http://police.xa.gov.cn/zwgk/zfwj/bmwj/1712411225725870081.html
  source_date: 2023-10-13
  valid_until: null
  verified_at: 2026-11-09
  needs_human: false
  needs_human_reason: null
  access_blocked: false
  lead: null
  lead_url: null

subsidies:
  - name: 大学生保障性租赁住房租金减免
    type: other
    amount: 享受 2 年租金减免，减免比例不低于承租项目租金备案价格的 50%；每人限一次
    amount_by_degree: {associate: null, bachelor: null, master: null, phd: null}
    period: null
    periods_max: null
    payout: 租金减免，不发现金；须租住指定保租房项目
    target: 普通高校毕业后 3 年内或"双一流"院校毕业后 5 年内的大学生
    conditions:
      - 在申请项目所在辖区内无自有住房，未享受其他政策性住房保障
      - 通过"i西安"APP 或市住建局保租房服务平台报名，按批次发布房源
    deadline_rule: 普通高校毕业 3 年内、"双一流"毕业 5 年内
    policy_name: 西安市保障性住房管理中心关于面向大学毕业生提供希望里·向阳等4个保租房项目房源的通告（2026）
    source_url: https://www.xa.gov.cn/gk/zfbz/zffp/2097616406225920001.html
    source_date: 2026-09
    valid_until: null
    verified_at: 2026-11-09
    needs_human: false
    needs_human_reason: null
    access_blocked: false
    lead: 西安航天基地等开发区另有硕博奖补（如博士 1 万、硕士 5000 元一次性奖励），属区级政策且年份较旧，未收录
