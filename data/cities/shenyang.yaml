flexible_employment:
  pension_base_min: 4533
  pension_rate: 20
  pension_year: 2026
  medical_monthly_min: 484.56
  medical_note: 沈阳市医保局口径（2025-12-01 起）：灵活就业医保以上年全口径平均工资 8076 元为基数、费率 6%，月缴费标准 484.56 元（官方原文直接给出）；另须同时参加职工大额医疗费用补助保险，每人每年 132 元（每年首次缴医保费时一并缴纳）
  monthly_total_min: 1391.16
  calc: 养老 906.6（辽人社〔2026〕19号附表 60% 档：基数 4533 × 20%）；医保 484.56（基数 8076 × 6%）；合计 1391.16 元/月（另有大额补助 132 元/年）
  hukou_restriction: 养老、医保均已放开就业地户籍限制；外省户籍凭居住证可在沈阳参保（养老在就业地/居住证所在地，医保在户籍地或就业地/居住证所在地）；医保自 2022 年修订后不再要求先参加养老保险
  nonlocal_allowed: true
  apply_channel: 医保：持身份证、居住证原件到就近医保中心办理，也可通过「沈阳智慧医保」掌上渠道、政务服务网个人网厅、辽事通线上办理（养老参保登记渠道未单独核实）
