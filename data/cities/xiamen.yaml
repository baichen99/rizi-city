subsidies:
  - name: 新就业大学生"5 年内 5 折租房"
    type: rent
    amount: 实物配租按市场评估租金五折（不超过 40㎡/人）；或租金补贴：思明、湖里每人每年 8000 元，集美、海沧 6000 元，同安、翔安 5000 元；保障期限最长 5 年
    amount_by_degree: {associate: null, bachelor: null, master: null, phd: null}
    period: year
    periods_max: 5
    payout: 按年（租金补贴）或实物配租
    target: 2021-01-01 后首次来厦就业创业、35 周岁（含）以下的全日制本科及以上毕业生
    conditions:
      - 与本市用工单位签 1 年以上劳动合同（或在厦办营业执照）
      - 在厦缴纳职工养老或医疗保险满 3 个月；本人及配偶在厦无自有住房
      - 逐步过渡到"实物配租为主、租金补贴为辅"
    deadline_rule: 首次来厦就业后 5 年内
    policy_name: 厦门市加大新就业大学生等青年群体租赁住房保障工作措施，厦住建规〔2026〕2号（2026-07-21 起施行，有效期 5 年）
    source_url: https://szjj.xm.gov.cn/zwgk/zfxxgk/zc/xzgfxwj/202607/t20260722_3008522.htm
    source_date: 2026-07-20
    valid_until: null
    verified_at: 2026-11-09
    needs_human: false
    needs_human_reason: 金额按区不同（5000—8000 元/年），未按学历填 amount_by_degree，暂不计入合计；按哪一档计入待你决定
    access_blocked: false
    lead: null
    lead_url: null
  - name: 青年人才"一张床"免费住宿
