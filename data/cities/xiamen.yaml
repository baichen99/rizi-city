flexible_employment:
  pension_base_min: 4579
  pension_rate: 20
  pension_year: 2026
  medical_monthly_min: 434.91
  medical_note: 厦门市 2026 年度口径（市人社局《2026 年度社保缴费标准》表二，转引市医保局、财政局、市税务局缴费率公告及闽医保函〔2026〕65号）：灵活就业医保费率 9.5%（个人缴纳），月缴费基数不低于 4579 元（2026-07-01 起，福建省统一区间 4579–22893）；月缴额为基数下限×费率测算，官方标准表未直接给月额。另：2026-03-01 起符合条件者可自愿同步按 0.7% 缴生育保险（厦医保〔2026〕24号），属自愿项，不计入最低额
  monthly_total_min: 1350.71
  calc: 养老 4579 × 20% = 915.80；医保 4579 × 9.5% = 434.91（基数下限，2026-07-01 起）；合计 1350.71 元/月
  hukou_restriction: 养老和职工医保均已放开厦门户籍限制，但须分别满足参保条件。养老：福建省人社厅 2024-10-24 问答列明，非本地户籍人员在居住地可持身份证和居住证参保；非本地户籍或无本地居住证的灵活就业人员在就业地可持身份证并签署参保承诺书办理，厦门具体受理材料以当地经办指南为准。医保：自 2023-01-01 起，法定劳动年龄内非厦门户籍人员可凭厦门市有效居住证参保；国家医保局 2026-10-20 再次确认该路径。不能把无户籍限制理解为无需办理材料；省级就业地医保参保路径的厦门具体经办材料仍待核实
  nonlocal_allowed: true
  apply_channel: 可按月、按季度、按半年、按年缴纳
  source_url: https://rst.fujian.gov.cn/zw/zfxxgk/zfxxgkml/zyywgz/ldgx/202610/t20261008_7221778.htm
  medical_source_url: https://app.hrss.xm.gov.cn/jcubing/12333query/file-api/V1/b22ad292-5aa1-45f2-846c-1b42e5ad0993.html
  hukou_source_url: https://www.nhsa.gov.cn/art/2026/10/20/art_14_23167.html
  verified_at: 2026-11-10
  needs_human: true
  needs_human_reason: 本次只核实外地户籍参保：养老已核省级居住地和就业地两条路径，厦门现行受理材料仍待当地经办指南确认；职工医保已核持厦门有效居住证路径，省级就业地医保参保路径在厦门的现行受理材料仍待当地经办指南确认。费用字段沿用上次核验，养老 20% 仍引用全国通行说明（https://www.gov.cn/yaowen/liebiao/202305/content_6855917.htm），未据本次资格核验提高费用数据的可信度。
  access_blocked: false

civil_service:
  fresh_grad_rule: 2026省考历史指南“应届生岗位”面向2026-01-01至12-31毕业、可出具就业协议书的规定普通高校毕业生；已签就业协议者可报，符合条件的非全日制研究生、高职扩招及第二学士学位毕业生视同。另含以当年在校生或应届生身份入伍、2025年内退役并取得毕业证学位证的大学生退役士兵。指南未将普通2024/2025届未就业者概括纳入，不可直接套用国考两年择业期。事业单位独立按招聘方案及岗位表审核。 事业单位依据：https://gxt.fujian.gov.cn/zwgk/rsxx/zkxx/202603/t20260319_7113311.htm
  exam_schedule: 2026省考（历史批次）：报名2026-01-19 09:00至01-23 17:00；行测、申论2026-03-14，公安专业2026-03-15，均已结束。2026省属事业单位招聘方案一（历史批次）：报名2026-03-24 08:00至03-30 16:00；笔试2026-04-25 09:00—11:00，均已结束。本次未查到可核实的2027省考公告，不推测2027日期。 事业单位依据：https://gxt.fujian.gov.cn/zwgk/rsxx/zkxx/202603/t20260319_7113311.htm
