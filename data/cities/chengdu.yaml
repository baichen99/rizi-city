subsidies:
  - name: 青年人才驿站（过渡性住宿）
    type: other
    amount: 免费入住（非现金补贴）：求职类单次最长7天6晚、可续住累计最长30天；创新创业类最长3个月免费入住，续住再享最长3个月房费减半
    amount_by_degree: {associate: null, bachelor: null, master: null, phd: null}
    period: null
    periods_max: null
    payout: null
    target: 求职类：全日制大专及以上学历（含在读）、求职应聘成都本地企事业单位的青年人才；创新创业类：年满18周岁、在蓉无自有住房的来蓉留蓉创新创业青年人才
    conditions:
      - 求职类单次入住最长7天6晚，由各区（市）县根据实际情况确定；续住按各区（市）县驿站规定继续申请，累计最长30天
      - 创新创业类免费床位仅供本人使用，须提供身份证、学历证明及在蓉创业或就业佐证材料
      - 创新创业类房费先缴后补，具体以所在区（市）县驿站操作细则为准
    deadline_rule: null
    policy_name: 成都青年人才驿站《求职青年短期入住申请须知》《“三免三减”房源申请须知》（驿站官方平台 home.cdcyl.org.cn 公布，求职类 web-sys-inn、创业类 web-sys-smsj）
    source_url: https://www.chinajob.mohrss.gov.cn/c/2024-12/2024-12-20/324747.shtml
    source_date: null
    valid_until: null
    verified_at: 2026-11-10
    needs_human: false
    needs_human_reason: null
    access_blocked: false
    lead: 成办规〔2026〕1号支持保租房用作青年人才驿站，并鼓励各区（市）县对人才承租人制定租金补贴、减免政策（区级标准各异）
