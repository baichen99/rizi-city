hukou:
  summary: 45 周岁以下全日制本科、普通高校研究生（不限年龄）经人社部门认定可直接落户，不要求先就业；全日制专科 35 周岁以下，落户中心城区需在落户地正常缴纳社保
  education_min: 全日制普通高校专科
  age_limit: 专科 35 周岁以下、本科 45 周岁以下；研究生原文未设年龄限制
  requires_job_or_social_security: null   # 分学历不同，见 tier_by_degree
  eligible_by_degree: {associate: true, bachelor: true, master: true, phd: true}
  tier_by_degree: {associate: job, bachelor: direct, master: direct, phd: direct}
  age_max_by_degree: {associate: 35, bachelor: 45, master: 0, phd: 0}
