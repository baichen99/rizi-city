pitfalls:
  - text: 北京落户靠用人单位的引进指标，不是个人申请；而且有年龄线（本科原则上 26 周岁），读研、延毕都可能超龄。
    source_url: https://rsj.beijing.gov.cn/xxgk/2024zcwj/202406/t20240617_3717192.html
  - text: 北京以灵活就业身份自己交社保，目前网办渠道要求北京户籍；非京籍自由职业者通常没法在北京个人参保。
    source_url: https://banshi.beijing.gov.cn/pubtask/bhyjs/lhjy/lhjy.html

