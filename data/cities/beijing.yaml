hukou:
  summary: 用人单位指标制：由符合条件的单位申请引进；原则上本科不超过 26 周岁、硕士不超过 30 周岁、博士不超过 35 周岁，京外本科仅限"双一流"建设高校
  education_min: 本科（京外仅限"双一流"建设高校；部分行业另有例外）
  age_limit: 原则上本科不超过 26 周岁、硕士 30 周岁、博士 35 周岁
  requires_job_or_social_security: true
  eligible_by_degree: {associate: false, bachelor: true, master: true, phd: true}
  tier_by_degree: {associate: null, bachelor: quota, master: quota, phd: quota}
  age_max_by_degree: {associate: null, bachelor: 26, master: 30, phd: 35}
  conditions:
    - 必须由在京注册、具备档案管理权限的用人单位使用引进指标申请
    - 专业需符合单位主营业务、与岗位匹配
    - 京外高校本科须为"双一流"建设高校（文化、体育、郊区教师、医疗等岗位有例外）
  apply_window: 按年度由用人单位申报，具体以当年通知为准
  policy_name: 北京市引进毕业生管理办法，京人社毕发〔2021〕22号（2021-07-16 实施，现行有效）
  source_url: https://rsj.beijing.gov.cn/xxgk/2024zcwj/202406/t20240617_3717192.html
  source_date: 2021-07-05
  valid_until: null
  verified_at: 2026-11-09
  needs_human: false
  needs_human_reason: null
  access_blocked: false
  lead: null
  lead_url: null

subsidies:
  - name: 海淀区青年人才安居补贴（海青安居）
    type: other
    amount: 经认定的海淀区重点产业体系内用人单位就业的应届毕业生，每月 1000 元、最长 2 年；在海淀北部租房的每月再加 500 元（区级政策、限行业，不计入北京合计）
    amount_by_degree: {associate: null, bachelor: null, master: null, phd: null}
    period: month
    periods_max: 24
    payout: 按月
    target: 2026 年 1—12 月毕业、全日制本科及以上、在海淀区重点产业用人单位就业或自主创业并在海淀缴社保的毕业生
    conditions:
      - 用人单位须在海淀注册纳税并属于"1+X+1"产业体系（人工智能、集成电路、生物医药、商业航天、科技服务业等）
      - 本人及家庭在京无住房，未享受其他住房保障
      - 申请人与用人单位联合提交，首次 2026-03-01 至 03-15，此后每月 1—10 日
    deadline_rule: 按毕业年度申请（2026 年为 2026 届）
    policy_name: 海淀区关于支持"海青安居"的若干措施（有效期至 2028-12-31）；海淀区人才工作局关于开展 2026 年海淀区青年人才安居补贴申请的通知
    source_url: https://zyk.bjhd.gov.cn/zwdt/zcwj/202602/t20260228_4806584.shtml
    source_date: 2026-02-28
    valid_until: 2028-12-31
    verified_at: 2026-11-09
    needs_human: false
    needs_human_reason: null
    access_blocked: false
    lead: null
    lead_url: null

